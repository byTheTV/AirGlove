[package]
name = "airglove"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
btleplug = "0.11"
crc = "3"
cpal = "0.16"
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
futures-util = "0.3"
glam = "0.30"
regex = "1"
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
lto = "thin"
strip = "symbols"

[build-dependencies]
winresource = "0.1"
